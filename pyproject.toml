[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universitydb"
version = "0.1.0"
description = "Bounded local S6 LangGraph demonstrator"
requires-python = ">=3.12,<3.13"
dependencies = ["langgraph==1.2.20", "openai==3.46.0", "streamlit==1.67.0", "sqlglot==30.30.0", "pydantic==2.14.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/universitydb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
